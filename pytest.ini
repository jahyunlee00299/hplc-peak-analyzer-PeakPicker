[pytest]
# Collect only the live suite.
#
# Without this, a bare `pytest` walks archive/backup_scripts/ (superseded
# copies of tests kept for reference) and dies during collection with
# "ValueError: I/O operation on closed file", so the whole suite reports
# "no tests collected" and every real test goes unrun. Running `pytest tests/`
# worked, which is what hid it: the failure looked like a stale environment
# rather than a config gap.
#
# Keep this file ASCII-only. iniconfig reads it with the locale codec (cp949
# on this machine), so a non-ASCII byte here makes pytest fail to start at all.
testpaths = tests
norecursedirs = archive .git __pycache__ results methods docs examples
