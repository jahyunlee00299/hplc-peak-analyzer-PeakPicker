method_id: sp0810_gal_tag_galol_v1
column: SP0810
detector: RID
signal_file: RID1A.ch

compounds:
  # RT/화합물 매핑, calibration slope/intercept 출처:
  #   sp0810_std_gal_galol_tag_2606.xlsx (Sheet1, 5-point std: 10/5/2.5/1.25/0.625 mM)
  #   Area = y0 + a * C 로 피팅됨 (rows 30-39) -> 요약 Area 테이블(rows 21-25)과
  #   대조하여 순서 확정 (RT19.0=Gal / RT26.6=Tag / RT41.5=Galol, RT 오름차순과
  #   화합물 순서가 일치하지 않음에 주의 — 260812 세션에서 area 값으로 직접 매칭 확인)
  #
  #   conc(mM) = (area - y0) / a

  Gal:
    rt_expected: 19.05
    rt_window: [18.5, 19.6]
    calibration:
      slope: 69587.6626      # a
      intercept: -6370.9125  # y0
      r2: null
      source: "sp0810_std_gal_galol_tag_2606.xlsx (260812 session, area-matched)"
    color: "#3498db"

  Tag:
    rt_expected: 26.65
    rt_window: [26.0, 27.3]
    calibration:
      slope: 58227.8378      # a
      intercept: -284.3917   # y0
      r2: null
      source: "sp0810_std_gal_galol_tag_2606.xlsx (260812 session, area-matched)"
    color: "#e67e22"

  Galol:
    rt_expected: 41.57
    rt_window: [40.8, 42.3]
    calibration:
      slope: 75968.4499      # a
      intercept: 3183.7165   # y0
      r2: null
      source: "sp0810_std_gal_galol_tag_2606.xlsx (260812 session, area-matched)"
    color: "#9b59b6"

  # Formate은 SP0810 컬럼에서 분석 불가 (사용자 확인, 260812) — method에서 제외

baseline:
  method: valley_dropline
  smoothing: savgol
  smoothing_window: 11
  smoothing_poly: 3

peak_detection:
  min_prominence_factor: 3.0
  min_height_fraction: 0.01
  distance_pts: 10

qc:
  ne_control_keyword: "_NC_"
  max_product_area_ne: 5000
  min_r2_calibration: 0.95
